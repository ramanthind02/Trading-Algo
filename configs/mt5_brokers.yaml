      YM:   US30.cash     # Dow Jones 30 CFD
      DAX:  GER40.cash    # DAX 40 CFD
      FTSE: UK100.cash    # FTSE 100 CFD
      GC:   XAUUSD        # Gold
      SI:   XAGUSD        # Silver
      CL:   USOIL.cash    # WTI Crude CFD
      NG:   NATGAS.cash   # Natural Gas CFD
      EURUSD: EURUSD
      GBPUSD: GBPUSD
      USDJPY: USDJPY
      AUDUSD: AUDUSD
      USDCHF: USDCHF
      AUDNZD: AUDNZD
      EURCHF: EURCHF
    candidates:
      ES:   [SP500, US500, USA500, SPX500]
      NQ:   [US100, NAS100, NDX, USTEC, USATECH]
      YM:   [US30, DOW, WS30, USA30]
      DAX:  [GER40, DE40, GDAXI, DAX40]
      FTSE: [UK100, FTSE100]
      GC:   [XAUUSD, GOLD]
      SI:   [XAGUSD, SILVER]
      CL:   [USOIL, XTIUSD, WTI, CL]
      NG:   [XNGUSD, NATGAS, NGAS]
    # Separate FTMO MT5 install (NOT the Darwinex terminal); feeds MT5Config.path.
    terminal_path: 'C:\Program Files\FTMO Global Markets MT5 Terminal\terminal64.exe'
    timezone: "EET"                 # broker server tz (EET winter / EEST summer)
    asset_classes:                  # canonical -> fx|index|metal|energy|crypto (native also resolves)
      ES: index
      NQ: index
      YM: index
      DAX: index
      FTSE: index
      GC: metal
      SI: metal
      CL: energy
      NG: energy
      EURUSD: fx
      GBPUSD: fx
      USDJPY: fx
      AUDUSD: fx
      USDCHF: fx
      AUDNZD: fx
      EURCHF: fx
    sessions:                       # per asset-class, times in broker tz; intraday bounds APPROX
      fx:     {weekdays: "0-4", open: "00:00", close: "24:00", daily_break: "23:58-00:02"}
      index:  {weekdays: "0-4", open: "01:00", close: "23:15"}                              # APPROX
      metal:  {weekdays: "0-4", open: "01:00", close: "24:00", daily_break: "23:58-01:01"}  # APPROX
      energy: {weekdays: "0-4", open: "01:00", close: "23:15"}                              # APPROX
      crypto: {weekdays: "0-6", open: "00:00", close: "24:00"}                              # 24/7
    rules:
      execution:
        account_mode: hedging       # FTMO demo is hedging
        filling_mode: IOC           # matches the adapter's FILLING_MODE
        max_deviation_points: 20
        default_lot_min: 0.01
        default_lot_step: 0.01
        weekend_holding: false      # FTMO: flat for the weekend (program-dependent)
        magic_number: 510
      risk:                         # standard FTMO Challenge defaults — vary by program/phase
        max_daily_loss_pct: 5.0
