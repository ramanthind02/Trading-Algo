<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chart Viewer</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1e1e2e; color: #cdd6f4; }

      #controls {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 16px;
        background: #181825;
      }

      #ticker_selector {
        padding: 6px 10px;
        font-size: 14px;
        background: #313244;
        color: #cdd6f4;
        border: 1px solid #45475a;
        border-radius: 4px;
        cursor: pointer;
      }

      #timeframe_switcher {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }

      .switcher-item {
        padding: 4px 10px;
        font-size: 13px;
        background: #313244;
        color: #a6adc8;
        border: 1px solid #45475a;
        border-radius: 4px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .switcher-item:hover { background: #45475a; }
      .switcher-active-item {
        background: #89b4fa;
        color: #1e1e2e;
        border-color: #89b4fa;
        font-weight: 600;
      }

      #load_more_btn {
        padding: 4px 10px;
        font-size: 13px;
        background: #a6e3a1;
        color: #1e1e2e;
        border: 1px solid #a6e3a1;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        display: none;
        transition: opacity 0.15s;
      }
      #load_more_btn:hover { opacity: 0.85; }
      #load_more_btn:disabled { opacity: 0.5; cursor: wait; }

      .date-range {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: auto;
      }
      .date-range input {
        padding: 4px 8px;
        font-size: 13px;
        width: 110px;
        background: #313244;
        color: #cdd6f4;
        border: 1px solid #45475a;
        border-radius: 4px;
      }
      .date-range label { font-size: 12px; color: #6c7086; }
      .date-range button {
        padding: 4px 10px;
        font-size: 13px;
        background: #89b4fa;
        color: #1e1e2e;
        border: 1px solid #89b4fa;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
      }
      .date-range button:hover { opacity: 0.85; }
      #date_clear_btn { background: #45475a; color: #cdd6f4; border-color: #45475a; }

      #cap_warning {
        font-size: 12px;
        color: #f9e2af;
        padding: 0 16px 4px;
        background: #181825;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }

      #tvchart {
        width: 100vw;
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
    <div id="controls">
      <select id="ticker_selector"></select>
      <div id="timeframe_switcher"></div>
      <button id="load_more_btn">Load 500 More</button>
      <div class="date-range">
        <label>From</label>
        <input type="text" id="date_from" placeholder="YYYY-MM-DD" />
        <label>To</label>
        <input type="text" id="date_to" placeholder="YYYY-MM-DD" />
        <button id="date_go_btn">Go</button>
        <button id="date_clear_btn">Clear</button>
      </div>
    </div>
    <div id="cap_warning"></div>
    <div id="tvchart"></div>
    </div>

    <script src="./tv.js"></script>
    <script src="./tv_helpers.js"></script>
    <script src="./index.js"></script>
  </body>
</html>
